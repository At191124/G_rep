<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Training Dashboard</title>
    <meta
      name="description"
      content="Private workout and training dashboard for tracking sessions, exercise data, and progress."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Trainer dashboard brand">
          <div class="brand-mark">A</div>
          <div>
            <strong>ActiveLedger</strong>
            <span>Training dashboard</span>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="pill-button" type="button">This week</button>
        </div>
      </header>

      <main class="dashboard">
        <section class="summary-grid" aria-label="Session summary cards">
          <article class="metric-card">
            <label>Total sessions</label>
            <strong id="total-sessions">0</strong>
            <small>Across all logs</small>
          </article>
          <article class="metric-card accent">
            <label>Total volume</label>
            <strong id="total-volume">0</strong>
            <small>Estimated load</small>
          </article>
          <article class="metric-card">
            <label>Average duration</label>
            <strong id="avg-duration">0m</strong>
            <small>Per workout</small>
          </article>
          <article class="metric-card">
            <label>Current streak</label>
            <strong id="streak-count">0</strong>
            <small>Days active</small>
          </article>
        </section>

        <section class="panel overview-panel" aria-label="Weekly training overview">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Overview</p>
              <h2>Training trend</h2>
            </div>
            <div class="filters" id="type-filters" aria-label="Workout type filters">
              <button class="filter-chip active" type="button" data-filter="all">All</button>
              <button class="filter-chip" type="button" data-filter="strength">Strength</button>
              <button class="filter-chip" type="button" data-filter="cardio">Cardio</button>
              <button class="filter-chip" type="button" data-filter="mobility">Mobility</button>
              <button class="filter-chip" type="button" data-filter="hiit">HIIT</button>
            </div>
          </div>
          <div id="weekly-chart" class="weekly-chart" aria-label="Weekly workout volume chart"></div>
        </section>

        <section class="panel message-panel" aria-label="Public update message">
          <div class="panel-header compact">
            <div>
              <p class="eyebrow">Update</p>
              <h2>Message</h2>
            </div>
          </div>
          <div id="public-message" class="public-message">No update yet.</div>
        </section>

        <section class="panel log-panel" aria-label="Workout list">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Journal</p>
              <h2>Workout log</h2>
            </div>
          </div>
          <div id="workout-list" class="workout-list"></div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
