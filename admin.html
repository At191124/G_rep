<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Admin</title>
    <link rel="stylesheet" href="styles.css?v=2026-08-30-1" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .admin-card {
        width: min(100%, 560px);
        padding: 28px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .admin-card h1 {
        margin: 0 0 18px;
      }

      .hidden {
        display: none;
      }

      .message {
        margin-top: 8px;
        color: var(--muted);
      }

      .error {
        color: #c53434;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="admin-card">
      <h1>Workout admin</h1>

      <div id="login-panel">
        <form id="admin-login-form" class="log-form">
          <label>
            <span>Password</span>
            <input id="admin-password" type="password" placeholder="Enter admin password" required />
          </label>
          <button class="primary-button" type="submit">Access editor</button>
        </form>
      </div>

      <div id="editor-panel" class="hidden">
        <form id="message-form" class="log-form">
          <label>
            <span>Workout entry</span>
            <textarea id="message-input" rows="12" placeholder="26.07.26&#10;Lat pulldowns: 105*7, 85*8, 65*9&#10;Triceps block pushdown with V hold: 50*4, 35*12, 25*9 (Mio repped to 14)&#10;Seated rows in machine: 120*5, 85*10, 65*13"></textarea>
          </label>
          <label>
            <span>GitHub token (optional, for repo sync)</span>
            <input id="github-token" type="password" placeholder="Optional PAT for GitHub sync" />
          </label>
          <div style="display:flex; gap:12px; flex-wrap:wrap;">
            <button class="primary-button" type="submit">Save message</button>
            <button id="logout-btn" class="ghost-button" type="button">Log out</button>
          </div>
        </form>
        <p class="message"><a href="/">Open public dashboard</a></p>
      </div>

      <p id="status-message" class="message"></p>
    </div>

    <script>
      const ADMIN_PASSWORD = 'workout-admin-2026';
      const MESSAGE_KEY = 'training-dashboard-message';

      const loginPanel = document.getElementById('login-panel');
      const editorPanel = document.getElementById('editor-panel');
      const adminLoginForm = document.getElementById('admin-login-form');
      const messageForm = document.getElementById('message-form');
      const statusMessage = document.getElementById('status-message');
      const passwordInput = document.getElementById('admin-password');
      const messageInput = document.getElementById('message-input');
      const githubTokenInput = document.getElementById('github-token');

      function setStatus(text, isError = false) {
        statusMessage.textContent = text;
        statusMessage.classList.toggle('error', isError);
      }

      function showEditor() {
        loginPanel.classList.add('hidden');
        editorPanel.classList.remove('hidden');
        messageInput.value = localStorage.getItem(MESSAGE_KEY) || '';
      }

      function showLogin() {
        editorPanel.classList.add('hidden');
        loginPanel.classList.remove('hidden');
        passwordInput.value = '';
      }

      function isLoggedIn() {
        return sessionStorage.getItem('training-dashboard-admin') === 'true';
      }

      if (isLoggedIn()) {
        showEditor();
      }

      adminLoginForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const value = passwordInput.value.trim();

        if (value === ADMIN_PASSWORD) {
          sessionStorage.setItem('training-dashboard-admin', 'true');
          setStatus('Access granted.');
          showEditor();
        } else {
          setStatus('Incorrect password.', true);
        }
      });

      function parseSetEntry(part) {
        const clean = String(part || '').replace(/\s+/g, ' ').trim();
        const match = clean.match(/^(\d+(?:\.\d+)?)\s*\*\s*(\d+)/i);
        if (!match) return null;
        const weight = Number(match[1]);
        const reps = Number(match[2]);
        if (!Number.isFinite(weight) || !Number.isFinite(reps)) return null;
        return { weight, reps };
      }

      function calculateExerciseVolume(sets) {
        if (!Array.isArray(sets) || !sets.length) return 0;
        return sets.reduce((sum, set) => sum + Number(set.weight || 0) * Number(set.reps || 0), 0);
      }

      function parseSessionEntry(rawText) {
        const text = String(rawText || '').trim();
        if (!text) return null;

        const lines = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
        if (!lines.length) return null;

        const date = lines[0].match(/\d{2}\.\d{2}\.\d{2}/)?.[0] || new Date().toISOString().slice(0, 10);
        const exerciseData = [];

        lines.slice(1).forEach((line) => {
          const match = line.match(/^(.+?):\s*(.+)$/);
          if (!match) return;

          const name = match[1].trim();
          const valueText = match[2].trim();
          const setEntries = valueText
            .split(',')
            .map((part) => part.trim())
            .filter(Boolean)
            .map((part) => parseSetEntry(part))
            .filter(Boolean);

          if (!setEntries.length) return;

          exerciseData.push({
            name,
            sets: setEntries,
            notes: valueText.includes('(') ? valueText.match(/\((.*)\)/)?.[1] || '' : ''
          });
        });

        if (!exerciseData.length) return null;

        const totalVolume = exerciseData.reduce((sum, exercise) => sum + calculateExerciseVolume(exercise.sets), 0);

        return {
          id: Date.now(),
          date,
          type: 'strength',
          name: `Workout ${date}`,
          duration: Math.max(30, exerciseData.length * 15),
          notes: text,
          exercises: exerciseData,
          totalVolume
        };
      }

      function base64Encode(value) {
        return btoa(unescape(encodeURIComponent(value)));
      }

      function readLocalWorkouts() {
        const raw = localStorage.getItem('training-dashboard-workouts');
        if (!raw) {
          return [];
        }

        try {
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          return [];
        }
      }

      async function syncToGithub(workouts, messageText) {
        const token = githubTokenInput.value.trim();
        if (!token) {
          return false;
        }

        const repoOwner = 'At191124';
        const repoName = 'G_rep';
        const filePath = 'data/workouts.json';
        const url = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`;

        try {
          const currentResponse = await fetch(url, {
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: 'application/vnd.github+json'
            }
          });

          if (!currentResponse.ok) {
            return false;
          }

          const currentFile = await currentResponse.json();
          const payload = {
            message: 'Update workout log from admin dashboard',
            content: base64Encode(JSON.stringify({
              message: messageText || 'No update yet.',
              workouts
            }, null, 2)),
            sha: currentFile.sha
          };

          const uploadResponse = await fetch(url, {
            method: 'PUT',
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: 'application/vnd.github+json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          return uploadResponse.ok;
        } catch (error) {
          return false;
        }
      }

      function saveSessionEntry(rawText) {
        const parsed = parseSessionEntry(rawText);
        if (!parsed) return false;

        const stored = JSON.parse(localStorage.getItem('training-dashboard-sessions') || '[]');
        stored.unshift(parsed);
        localStorage.setItem('training-dashboard-sessions', JSON.stringify(stored));
        localStorage.setItem('training-dashboard-workouts', JSON.stringify(stored));
        localStorage.setItem('training-dashboard-message', rawText);
        return true;
      }

      messageForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const content = messageInput.value.trim();

        if (!content) {
          setStatus('Please enter a workout entry.', true);
          return;
        }

        const saved = saveSessionEntry(content);
        if (!saved) {
          setStatus('Could not parse that workout entry.', true);
          return;
        }

        const workouts = readLocalWorkouts();
        const synced = await syncToGithub(workouts, content || 'No update yet.');

        localStorage.setItem('training-dashboard-workouts', JSON.stringify(workouts));
        localStorage.setItem(MESSAGE_KEY, content || 'No update yet.');
        setStatus(synced ? 'Message saved successfully and synced to GitHub.' : 'Message saved locally. Add a GitHub PAT to sync the public repo.');
      });

      document.getElementById('logout-btn').addEventListener('click', () => {
        sessionStorage.removeItem('training-dashboard-admin');
        setStatus('Signed out.');
        showLogin();
      });
    </script>
  </body>
</html>
